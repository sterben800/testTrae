<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霍格沃茨分院帽测试</title>
    <style>
        /* 全局样式 */
        body {
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #6b0f1a 0%, #5a189a 50%, #240046 100%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f0f0f0;
            position: relative;
            overflow-x: hidden;
        }
        
        /* 星星背景 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 130px 80px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.3;
            z-index: -1;
        }
        
        /* 容器 */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        
        /* 标题样式 */
        h1 {
            text-align: center;
            color: #ffd700;
            font-size: 2.8em;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            letter-spacing: 3px;
            font-weight: bold;
        }
        
        h2 {
            text-align: center;
            color: #f0f0f0;
            font-size: 1.3em;
            margin-bottom: 20px;
            font-weight: normal;
        }
        
        /* 帽子图片 */
        .hat-container {
            text-align: center;
            margin: 40px 0;
        }
        
        #sortingHat {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 4px solid #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5), 0 0 60px rgba(255, 215, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background: linear-gradient(135deg, rgba(90, 24, 154, 0.8) 0%, rgba(36, 0, 70, 0.8) 100%);
            padding: 15px;
        }
        
        #sortingHat:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.7), 0 0 80px rgba(255, 215, 0, 0.5);
        }
        
        /* 引导文字 */
        .intro-text {
            font-size: 1.1em;
            color: #e0e0e0;
            margin-bottom: 40px;
            line-height: 1.6;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        /* 问题区域 */
        .question-area {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
            border: 2px solid #ffd700;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        
        #questionText {
            font-size: 1.4em;
            margin-bottom: 30px;
            text-align: center;
            color: #ffd700;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
        
        /* 选项区域 */
        .options-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        /* 选项容器 */
        .option-container {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 215, 0, 0.5);
            border-radius: 10px;
            padding: 18px 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            position: relative;
        }
        
        /* 选中状态的选项 */
        .option-container.selected {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        
        .option-container:hover {
            background: rgba(255, 215, 0, 0.15);
            border-color: rgba(255, 215, 0, 0.8);
            transform: translateY(-2px);
        }
        
        /* 自定义单选按钮 */
        .option-radio {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 215, 0, 0.7);
            border-radius: 50%;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        /* 选中的单选按钮 */
        .option-container.selected .option-radio::after {
            content: '';
            width: 12px;
            height: 12px;
            background: #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }
        
        /* 选项文本 */
        .option-text {
            font-size: 1.1em;
            color: #f0f0f0;
            font-family: 'Georgia', serif;
        }
        
        /* 选中的选项文本 */
        .option-container.selected .option-text {
            color: #ffd700;
        }
        
        /* 下一题按钮 */
        #nextBtn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #240046;
            border: none;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Georgia', serif;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
            margin-top: 10px;
        }
        
        #nextBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.6);
        }
        
        /* 禁用状态的下一题按钮 */
        #nextBtn:disabled {
            background: rgba(255, 215, 0, 0.3);
            color: rgba(36, 0, 70, 0.5);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        /* 进度区域 */
        .progress-area {
            text-align: center;
            margin-bottom: 30px;
        }
        
        #progressText {
            font-size: 1.2em;
            color: #ffd700;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
        
        .progress-bar {
            width: 100%;
            height: 12px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 215, 0, 0.5);
        }
        
        #progressFill {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ffed4e);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            width: 0%;
            transition: width 0.5s ease;
        }
        
        /* 结果区域 */
        .result-area {
            display: none;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
            border: 2px solid #ffd700;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            margin-top: 40px;
        }
        
        .result-area h2 {
            color: #ffd700;
            font-size: 1.8em;
            margin-bottom: 30px;
        }
        
        #houseResult {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 25px;
        }
        
        #houseDescription {
            font-size: 1.3em;
            margin-bottom: 35px;
            line-height: 1.6;
            color: #e0e0e0;
        }
        
        /* 重新测试按钮 */
        #restartBtn {
            padding: 18px 35px;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #240046;
            border: none;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Georgia', serif;
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        #restartBtn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.6);
        }
        
        #restartBtn:active {
            transform: translateY(-1px);
        }
        
        /* 学院颜色 */
        .gryffindor {
            color: #ae0001;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3), 0 0 20px rgba(174, 0, 26, 0.5);
        }
        
        .hufflepuff {
            color: #ffdb00;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3), 0 0 20px rgba(255, 219, 0, 0.5);
        }
        
        .ravenclaw {
            color: #000080;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3), 0 0 20px rgba(0, 0, 128, 0.5);
        }
        
        .slytherin {
            color: #2a623d;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3), 0 0 20px rgba(42, 98, 61, 0.5);
        }
        
        /* 欢迎文字 */
        .welcome-text {
            font-size: 1.2em;
            color: #e0e0e0;
            margin: 30px 0;
            line-height: 1.6;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 2.2em;
            }
            
            #sortingHat {
                width: 180px;
                height: 180px;
            }
            
            .options-area {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .question-area,
            .result-area {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>霍格沃茨</h1>
        <h2>分院帽测试</h2>
        
        <div class="welcome-text">
            踏上魔法之旅，发现你真正的归属。分院帽将根据你的性格特质，为你选择最适合的霍格沃茨学院。
        </div>
        
        <div class="hat-container">
            <img id="sortingHat" src="https://www.pngplay.com/wp-content/uploads/5/Harry-Potter-Sorting-Hat-PNG-Picture.png" alt="分院帽">
        </div>
        
        <div class="progress-area">
            <div id="progressText">问题 1 / 10</div>
            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>
        </div>
        
        <div class="question-area">
            <div id="questionText">你的冒险即将开始...</div>
            <div class="options-area" id="optionsContainer"></div>
        </div>
        
        <div class="result-area" id="resultArea">
            <h2>分院结果</h2>
            <div id="houseResult">格兰芬多</div>
            <div id="houseDescription">勇敢、坚毅、无畏的格兰芬多欢迎你！</div>
            <button id="restartBtn">重新测试</button>
        </div>
    </div>
    
    <script>
        // 问题数据
        const questions = [
            {
                question: "你最看重的品质是什么？",
                options: [
                    { text: "勇敢", points: { gryffindor: 3, hufflepuff: 1, ravenclaw: 1, slytherin: 0 } },
                    { text: "智慧", points: { gryffindor: 1, hufflepuff: 0, ravenclaw: 3, slytherin: 1 } },
                    { text: "忠诚", points: { gryffindor: 0, hufflepuff: 3, ravenclaw: 1, slytherin: 1 } },
                    { text: "野心", points: { gryffindor: 0, hufflepuff: 0, ravenclaw: 1, slytherin: 3 } }
                ]
            },
            {
                question: "你会选择哪种宠物？",
                options: [
                    { text: "猫头鹰", points: { gryffindor: 1, hufflepuff: 1, ravenclaw: 3, slytherin: 1 } },
                    { text: "猫", points: { gryffindor: 2, hufflepuff: 1, ravenclaw: 2, slytherin: 2 } },
                    { text: "蟾蜍", points: { gryffindor: 0, hufflepuff: 3, ravenclaw: 1, slytherin: 0 } },
                    { text: "蛇", points: { gryffindor: 0, hufflepuff: 0, ravenclaw: 0, slytherin: 3 } }
                ]
            },
            {
                question: "你最害怕什么？",
                options: [
                    { text: "失败", points: { gryffindor: 1, hufflepuff: 1, ravenclaw: 1, slytherin: 3 } },
                    { text: "孤独", points: { gryffindor: 1, hufflepuff: 3, ravenclaw: 1, slytherin: 1 } },
                    { text: "无知", points: { gryffindor: 0, hufflepuff: 1, ravenclaw: 3, slytherin: 1 } },
                    { text: "恐惧本身", points: { gryffindor: 3, hufflepuff: 1, ravenclaw: 1, slytherin: 1 } }
                ]
            },
            {
                question: "你会选择哪个魔法物品？",
                options: [
                    { text: "隐形斗篷", points: { gryffindor: 2, hufflepuff: 1, ravenclaw: 2, slytherin: 2 } },
                    { text: "复活石", points: { gryffindor: 1, hufflepuff: 3, ravenclaw: 1, slytherin: 1 } },
                    { text: "老魔杖", points: { gryffindor: 2, hufflepuff: 0, ravenclaw: 1, slytherin: 3 } },
                    { text: "时间转换器", points: { gryffindor: 1, hufflepuff: 1, ravenclaw: 3, slytherin: 1 } }
                ]
            },
            {
                question: "你更喜欢哪种天气？",
                options: [
                    { text: "晴天", points: { gryffindor: 3, hufflepuff: 3, ravenclaw: 1, slytherin: 0 } },
                    { text: "雨天", points: { gryffindor: 1, hufflepuff: 1, ravenclaw: 3, slytherin: 2 } },
                    { text: "雪天", points: { gryffindor: 2, hufflepuff: 2, ravenclaw: 2, slytherin: 1 } },
                    { text: "多云", points: { gryffindor: 1, hufflepuff: 2, ravenclaw: 1, slytherin: 3 } }
                ]
            },
            {
                question: "你会如何面对挑战？",
                options: [
                    { text: "直接冲上去", points: { gryffindor: 3, hufflepuff: 1, ravenclaw: 1, slytherin: 1 } },
                    { text: "制定计划", points: { gryffindor: 1, hufflepuff: 1, ravenclaw: 3, slytherin: 2 } },
                    { text: "寻求帮助", points: { gryffindor: 1, hufflepuff: 3, ravenclaw: 1, slytherin: 0 } },
                    { text: "利用资源", points: { gryffindor: 0, hufflepuff: 1, ravenclaw: 2, slytherin: 3 } }
                ]
            },
            {
                question: "你最想去霍格沃茨的哪个地方？",
                options: [
                    { text: "魁地奇球场", points: { gryffindor: 3, hufflepuff: 2, ravenclaw: 1, slytherin: 1 } },
                    { text: "图书馆", points: { gryffindor: 1, hufflepuff: 1, ravenclaw: 3, slytherin: 1 } },
                    { text: "厨房", points: { gryffindor: 1, hufflepuff: 3, ravenclaw: 1, slytherin: 0 } },
                    { text: "斯莱特林公共休息室", points: { gryffindor: 0, hufflepuff: 0, ravenclaw: 1, slytherin: 3 } }
                ]
            },
            {
                question: "你会选择哪种课程？",
                options: [
                    { text: "黑魔法防御术", points: { gryffindor: 3, hufflepuff: 1, ravenclaw: 1, slytherin: 2 } },
                    { text: "变形术", points: { gryffindor: 2, hufflepuff: 1, ravenclaw: 2, slytherin: 2 } },
                    { text: "草药学", points: { gryffindor: 1, hufflepuff: 3, ravenclaw: 1, slytherin: 1 } },
                    { text: "魔药学", points: { gryffindor: 0, hufflepuff: 1, ravenclaw: 2, slytherin: 3 } }
                ]
            },
            {
                question: "你会如何处理冲突？",
                options: [
                    { text: "挺身而出", points: { gryffindor: 3, hufflepuff: 1, ravenclaw: 0, slytherin: 1 } },
                    { text: "调解双方", points: { gryffindor: 1, hufflepuff: 3, ravenclaw: 1, slytherin: 0 } },
                    { text: "寻找解决方案", points: { gryffindor: 1, hufflepuff: 1, ravenclaw: 3, slytherin: 1 } },
                    { text: "保护自己", points: { gryffindor: 0, hufflepuff: 0, ravenclaw: 1, slytherin: 3 } }
                ]
            },
            {
                question: "你希望别人如何评价你？",
                options: [
                    { text: "勇敢的", points: { gryffindor: 3, hufflepuff: 1, ravenclaw: 1, slytherin: 0 } },
                    { text: "聪明的", points: { gryffindor: 1, hufflepuff: 0, ravenclaw: 3, slytherin: 1 } },
                    { text: "善良的", points: { gryffindor: 0, hufflepuff: 3, ravenclaw: 1, slytherin: 0 } },
                    { text: "成功的", points: { gryffindor: 1, hufflepuff: 0, ravenclaw: 1, slytherin: 3 } }
                ]
            }
        ];
        
        // 学院描述
        const houseDescriptions = {
            gryffindor: "勇敢、坚毅、无畏的格兰芬多欢迎你！这里培养了许多伟大的巫师，包括哈利·波特和邓布利多校长。格兰芬多的学生总是挺身而出，为正义而战。",
            hufflepuff: "忠诚、善良、勤奋的赫奇帕奇欢迎你！赫奇帕奇以其包容性和努力工作而闻名，这里的学生重视友谊和公平竞争。",
            ravenclaw: "智慧、创造力、好奇心的拉文克劳欢迎你！拉文克劳的学生热爱学习，追求知识，这里培养了许多伟大的学者和发明家。",
            slytherin: "野心、 cunning、领导力的斯莱特林欢迎你！斯莱特林的学生有强烈的目标感和决心，这里培养了许多有影响力的巫师。"
        };
        
        // 全局变量
        let currentQuestionIndex = 0;
        let scores = { gryffindor: 0, hufflepuff: 0, ravenclaw: 0, slytherin: 0 };
        
        // DOM元素
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const progressText = document.getElementById('progressText');
        const progressFill = document.getElementById('progressFill');
        const resultArea = document.getElementById('resultArea');
        const houseResult = document.getElementById('houseResult');
        const houseDescription = document.getElementById('houseDescription');
        const restartBtn = document.getElementById('restartBtn');
        const sortingHat = document.getElementById('sortingHat');
        
        // 初始化测试
        function initTest() {
            currentQuestionIndex = 0;
            scores = { gryffindor: 0, hufflepuff: 0, ravenclaw: 0, slytherin: 0 };
            resultArea.style.display = 'none';
            showQuestion();
        }
        
        // 显示当前问题
        function showQuestion() {
            const question = questions[currentQuestionIndex];
            questionText.textContent = question.question;
            
            // 更新进度
            progressText.textContent = `问题 ${currentQuestionIndex + 1} / ${questions.length}`;
            progressFill.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;
            
            // 清空选项
            optionsContainer.innerHTML = '';
            
            // 创建选项容器
            let selectedOption = null;
            
            // 创建下一题按钮
            const nextBtn = document.createElement('button');
            nextBtn.id = 'nextBtn';
            nextBtn.textContent = '下一题';
            nextBtn.disabled = true;
            nextBtn.onclick = () => {
                if (selectedOption) {
                    processOption(selectedOption);
                }
            };
            
            // 创建选项
            question.options.forEach((option, index) => {
                // 创建选项容器
                const optionContainer = document.createElement('div');
                optionContainer.className = 'option-container';
                
                // 创建单选按钮
                const radio = document.createElement('div');
                radio.className = 'option-radio';
                
                // 创建选项文本
                const text = document.createElement('div');
                text.className = 'option-text';
                text.textContent = option.text;
                
                // 组装选项
                optionContainer.appendChild(radio);
                optionContainer.appendChild(text);
                
                // 添加点击事件
                optionContainer.onclick = () => {
                    // 移除其他选项的选中状态
                    document.querySelectorAll('.option-container').forEach(container => {
                        container.classList.remove('selected');
                    });
                    
                    // 添加当前选项的选中状态
                    optionContainer.classList.add('selected');
                    selectedOption = option;
                    
                    // 启用下一题按钮
                    nextBtn.disabled = false;
                };
                
                // 添加到选项容器
                optionsContainer.appendChild(optionContainer);
            });
            
            // 添加下一题按钮
            optionsContainer.appendChild(nextBtn);
        }
        
        // 处理选项选择
        function processOption(option) {
            // 更新分数
            Object.keys(option.points).forEach(house => {
                scores[house] += option.points[house];
            });
            
            // 下一题或显示结果
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }
        
        // 显示结果
        function showResult() {
            // 计算最高分学院
            let maxScore = 0;
            let selectedHouse = 'gryffindor';
            
            Object.keys(scores).forEach(house => {
                if (scores[house] > maxScore) {
                    maxScore = scores[house];
                    selectedHouse = house;
                }
            });
            
            // 显示结果
            houseResult.textContent = getHouseName(selectedHouse);
            houseResult.className = selectedHouse;
            houseDescription.textContent = houseDescriptions[selectedHouse];
            
            // 切换显示区域
            resultArea.style.display = 'block';
        }
        
        // 获取学院中文名称
